[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bifrost-shen"
version = "0.2.0"
description = "Bifrost — cross-implementation Shen meta test harness + Roswell-style front door (Go binary)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["shen", "testing", "differential-testing", "conformance", "launcher"]

# uvx path: the wheel build compiles the Go binary on the target machine (needs
# the Go toolchain) and the console script execs it. So `uvx --from git+URL
# bifrost` runs the native Go binary with no manual install. The no-Go paths are
# `go install github.com/pyrex41/bifrost@latest` and the release binaries.
[project.scripts]
bifrost = "bifrost_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pybin/bifrost_cli"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "pybin/hatch_build.py"

[tool.hatch.build.targets.sdist]
# Ship the Go sources so the wheel can be built from an sdist / git checkout.
include = [
  "pybin", "go.mod", "*.go", "adapters.json", "cases", "programs", "examples", "README.md",
]
