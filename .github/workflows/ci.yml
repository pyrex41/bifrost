name: bifrost-matrix

# Bifrost is a META harness: it drives whatever Shen implementations it can
# find and diffs them against each other. CI is best-effort -- it builds the
# ports it can, and Bifrost SKIPS-AND-REPORTS any impl whose launcher is
# missing rather than failing the job. A run only fails on a real divergence
# FAILURE (documented DIVERGEnces do not fail).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- best-effort build/fetch of the ports CI can manage ----
      # The ports live in sibling repos; CI here clones the ones that build
      # quickly in a hosted runner. Any that are absent are skipped by Bifrost.

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build shen-go (best-effort)
        continue-on-error: true
        run: |
          if [ -d "$GITHUB_WORKSPACE/../shen-go" ]; then
            go build -o "$GITHUB_WORKSPACE/.bin/shen-go" -C "$GITHUB_WORKSPACE/../shen-go" ./cmd/shen
          else
            echo "shen-go source not present in CI; Bifrost will skip it."
          fi

      - name: Set up Node (for ShenScript)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show what Bifrost can see
        run: python3 bifrost.py --list

      - name: Run the Bifrost matrix (best-effort, skip-and-report missing impls)
        run: |
          # If literally no impl is present, that is an environment gap, not a
          # conformance failure: treat as a soft pass so the job stays green
          # while clearly reporting the gap in the log.
          set +e
          python3 bifrost.py
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "::warning::No Shen implementations available in this CI runner; nothing to diff."
            exit 0
          fi
          exit $rc
