name: portability

# Exercise parameterised path/config/launcher helpers on all supported host
# families. No Shen port is required for these Go unit tests.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Go portability and CLI tests
        run: go test ./...
      - name: Build CLI
        run: go build ./...
