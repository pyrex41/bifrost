name: portability

# Verifies Bifrost's cross-platform plumbing on Linux, macOS AND Windows.
# These tests exercise the parameterised portability helpers (path/config
# resolution, launcher wrapping, OS overrides, the subcommand router) and need
# NO Shen ports installed -- so the Windows code paths are proven on a real
# Windows runner without having to build seven Shen ports there. The full
# differential matrix lives in ci.yml (Linux, best-effort with real ports).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Portability unit tests (bifrost)
        run: python -m pytest test_portable.py -q

      - name: Import + CLI smoke (no ports needed)
        shell: python
        run: |
          import subprocess, sys
          import bifrost  # must import cleanly on every OS
          # `impls` and `--list` run with zero ports present (all SKIPPED).
          for argv in (["impls"], ["--list"]):
              rc = bifrost.main(argv)
              assert rc == 0, (argv, rc)
          # The router must not intercept the test-matrix flags.
          assert bifrost.dispatch_subcommand(["--suite", "x.json"]) is None
          print("smoke OK on", sys.platform)

      - name: Ratatoskr CLI import + targets (sibling checkout optional)
        shell: python
        run: |
          import os, sys, subprocess
          rat = os.path.join("..", "ratatoskr")
          if not os.path.isfile(os.path.join(rat, "ratatoskr_cli.py")):
              print("ratatoskr not checked out alongside; skipping")
              sys.exit(0)
          sys.path.insert(0, rat)
          import ratatoskr_cli as r
          assert r.wrap_executable(["x/build.sh"], is_windows=True)[0] == "sh"
          print("ratatoskr import OK on", sys.platform)
