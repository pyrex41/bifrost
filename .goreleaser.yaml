# GoReleaser config — produces release binaries for the no-Go install path.
# Cut a release by pushing a tag: `git tag v0.2.0 && git push origin v0.2.0`
# (the release workflow runs this). `go install github.com/pyrex41/bifrost@latest`
# is the source-install path.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: bifrost
    main: .
    binary: bifrost
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: bifrost
    name_template: "bifrost_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  draft: false
